name: Refresh profile cards

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate light stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&hide_border=true&bg_color=FFFFFF&title_color=6D28D9&text_color=1F2328&icon_color=2563EB
          path: assets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate dark stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&hide_border=true&bg_color=0D1117&title_color=A78BFA&text_color=C9D1D9&icon_color=58A6FF
          path: assets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate light language card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=FFFFFF&title_color=6D28D9&text_color=1F2328
          path: assets/languages-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate dark language card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=A78BFA&text_color=C9D1D9
          path: assets/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated cards
        run: |
          if git diff --quiet -- assets; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: refresh profile cards"
          git push
